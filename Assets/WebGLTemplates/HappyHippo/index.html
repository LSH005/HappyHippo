<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HappyHippo</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
#if SHOW_DIAGNOSTICS
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <div id="rotate-overlay" class="hh-overlay"><div class="hh-card"><p>기기를 가로로 돌려주세요</p></div></div>
    <div id="ios-overlay" class="hh-overlay">
      <div class="hh-card">
        <p>전체 화면으로 플레이하려면 공유 버튼을 누른 뒤 홈 화면에 추가를 선택해 주세요.</p>
        <button id="ios-dismiss" type="button">다시 보지 않기</button>
      </div>
    </div>
    <div id="tap-overlay" class="hh-overlay"><div class="hh-card"><p>화면을 터치하여 시작</p></div></div>
    <button id="fs-return" type="button">전체화면</button>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var iosStorageKey = "happyhippo-ios-a2hs-dismissed";
      var fullscreenGranted = false;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function updateViewportHeight() {
        document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
      }

      function isMobileDevice() {
        var ua = navigator.userAgent || "";
        if (/iPhone|iPad|iPod|Android/i.test(ua)) return true;
        return navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua);
      }

      function isIosDevice() {
        var ua = navigator.userAgent || "";
        if (/iPhone|iPad|iPod/i.test(ua)) return true;
        return navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua);
      }

      function isStandaloneDisplay() {
        return window.navigator.standalone === true ||
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches;
      }

      function requestGameFullscreen() {
        var element = document.documentElement;
        var request = null;
        try {
          if (element.requestFullscreen) request = element.requestFullscreen({ navigationUI: "hide" });
          else if (element.webkitRequestFullscreen) request = element.webkitRequestFullscreen();
        } catch (error) {
          return;
        }
        var lockLandscape = function () {
          if (!screen.orientation || !screen.orientation.lock) return;
          var locked = screen.orientation.lock("landscape");
          if (locked && locked.catch) locked.catch(function () {});
        };
        if (request && request.then) request.then(lockLandscape).catch(function () {});
        else lockLandscape();
      }

      function onFullscreenChange() {
        var active = document.fullscreenElement || document.webkitFullscreenElement;
        var returnButton = document.getElementById("fs-return");
        if (active) {
          fullscreenGranted = true;
          returnButton.classList.remove("visible");
        } else if (fullscreenGranted && isMobileDevice()) {
          returnButton.classList.add("visible");
        }
      }

      updateViewportHeight();
      window.addEventListener("resize", updateViewportHeight);
      window.addEventListener("orientationchange", updateViewportHeight);

      var mobile = isMobileDevice();
      var standalone = isStandaloneDisplay();
      if (mobile) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
#if SHOW_DIAGNOSTICS
        var diagnosticsIcon = document.getElementById("diagnostics-icon");
        diagnosticsIcon.style.position = "fixed";
        diagnosticsIcon.style.bottom = "10px";
        diagnosticsIcon.style.right = "0px";
        canvas.after(diagnosticsIcon);
#endif
      }

      var portraitQuery = window.matchMedia("(orientation: portrait)");
      function updateRotateOverlay() {
        document.getElementById("rotate-overlay").classList.toggle("visible", mobile && portraitQuery.matches);
      }
      if (portraitQuery.addEventListener) portraitQuery.addEventListener("change", updateRotateOverlay);
      else if (portraitQuery.addListener) portraitQuery.addListener(updateRotateOverlay);
      updateRotateOverlay();

      if (isIosDevice() && !standalone && localStorage.getItem(iosStorageKey) !== "1") {
        document.getElementById("ios-overlay").classList.add("visible");
      }
      document.getElementById("ios-dismiss").addEventListener("click", function () {
        localStorage.setItem(iosStorageKey, "1");
        document.getElementById("ios-overlay").classList.remove("visible");
      });

      document.getElementById("tap-overlay").addEventListener("click", function () {
        requestGameFullscreen();
        document.getElementById("tap-overlay").classList.remove("visible");
      });
      document.getElementById("fs-return").addEventListener("click", requestGameFullscreen);
      document.addEventListener("fullscreenchange", onFullscreenChange);
      document.addEventListener("webkitfullscreenchange", onFullscreenChange);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      if (mobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
#if SHOW_DIAGNOSTICS
          document.getElementById("diagnostics-icon").onclick = () => {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
          };
#endif
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          if (mobile && !standalone && !document.fullscreenElement && !document.webkitFullscreenElement) {
            document.getElementById("tap-overlay").classList.add("visible");
          }
#if DEVELOPMENT_PLAYER
          var profile = unityProfiler.createButton(unityInstance);
          profile.style.marginLeft = "5px";
          document.querySelector("#unity-build-title").appendChild(profile);
#endif
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
